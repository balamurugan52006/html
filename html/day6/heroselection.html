    <head>
        <title>Hero Selection</title>

                <body>
        <section>
            <div>

                <input type="radio" required name="gender">FeMale
                <br/>

                <label>Email</label>
                <br/>
                <input type="text"required placeholder="Email">
                <br/>
                <label>Inspiration</label>

                <br/>
                <label>My Powers</label>
                <br/>
                <input type="text"required placeholder="My Powers">
                <br/>
                <label>Skills</label>

                <br/>
                <input type="checkbox" name="Skills"> Flying
                <input type="checkbox" name="Skills"> Super Strength 
                <input type="checkbox" name="Skills"> Speed
                <input type="checkbox" name="Skills"> fighting 
                <br/>
                <label>Responsible</label>
                <br/>
                <input type="text" required placeholder="Responsible">
                <br/>
                <label>Mission Experience</label> 
                <br/>
                <input type="text" required placeholder="Mission Experience">
                <br/>
                <input type="submit" value="Register"> 

                <textarea cols="10" rows="10"></textarea>
                </form>
                </center>       
            </div>
        </section>

</html>
