<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flipkart Clone</title>
    <link rel="stylesheet" href="../assets/navbar.css">
</head>
<body>

    <!-- Navbar -->
    <header>
        <div class="logo">
            <h2>Flipkart</h2>
        </div>

        <div class="search">
            <input type="text" placeholder="Search">
        </div>

        <div class="nav">
            <button>Login</button>
            <a href="#">more</a>
            <a href="#">cart</a>
        </div>
    </header>

    <!-- Banner -->
    <section class="banner">
      <img src="../assets/iamge/decothlon/1.jpg" alt="Banner">
    </section>

    <!-- Products -->
    <section class="products">
        <div class="product-card">
            <img src="../assets/iamge/decothlon/2.avif" alt="Phone">
            <h3>Smart Phone</h3>
            <p>₹15,999</p>
            <button>Buy Now</button>
        </div>

        <div class="product-card">
            <img src="../assets/iamge/decothlon/3.jpg" alt="Laptop">
            <h3>Laptop</h3>
            <p>₹45,999</p>
            <button>Buy Now</button>
        </div>

        <div class="product-card">
            <img src="../assets/iamge/decothlon/5.webp" alt="Headphones">
            <h3>Headphones</h3>
            <p>₹1,999</p>
            <button>Buy Now</button>
        </div>

        <div class="product-card">
            <img src="../assets/iamge/decothlon/4.webp" alt="Shoes">
            <h3>Shoes</h3>
            <p>₹2,499</p>
            <button>Buy Now</button>
        </div>
    </section>

</body>
</html>
