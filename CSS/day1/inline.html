<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline CSS</title>
</head>
<body>
    <h1 style="background-color: red; color: blue;">This Is First Tag</h1>
    <p style="background-color: red; color: blue;">This Is Second Tag</p>
    <div style="background-color: red; color: blue;">This Is Third Tag</div>
    <br>
    <span style="background-color: red; color: blue;">This Is Fourth Tag</span>
    <br>
    <h3 style="background-color: red; color: blue;">This Is Fifth tag</h3>

    
</body>
</html>
