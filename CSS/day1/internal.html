<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internal CSS</title>

    <style>
        h1 {
            background-color: yellow;
            color: black;

        }

        p {
           background-color: yellow;
           color: black;

        }

        div {
             background-color: yellow;
             color: black;

        }

        span {
              background-color: yellow;
              color: black;

        }


        h3 {
            background-color: yellow;
            color: black;

        }
 

    </style>
</head>
<body>
    <h1>This Is First Tag</h1>
    <p>This Is Second Tag</p>
    <div>This Is Third Tag</div>
    <br>
    <span>This Is Fourth Tag</span>
    <br>
    <h3>This Is Fifth Tag</h3>
</body>
</html>
